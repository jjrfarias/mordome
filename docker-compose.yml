services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mordome
      POSTGRES_USER: mordome
      POSTGRES_PASSWORD: mordome_local
    ports:
      - "5432:5432"
    volumes:
      - mordome_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mordome -d mordome"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mordome_postgres:
